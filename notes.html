  <link rel="canonical" href="https://yidoer.github.io/notes.html">
  <link rel="alternate" type="application/rss+xml" title="人间浊物 琅上清书 · 小记" href="https://yidoer.github.io/feed-notes.xml">
  <link rel="alternate" type="application/rss+xml" title="人间浊物 琅上清书" href="https://yidoer.github.io/feed.xml">
  <meta property="og:type" content="website">
  <meta property="og:title" content="小记 - 人间浊物 琅上清书">
  <meta property="og:description" content="片言只语，随感随记。不求长篇，但求真意。">
  <meta property="og:url" content="https://yidoer.github.io/notes.html">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <img class="logo-avatar" src="images/touxiang.jpg" alt="清" width="30" height="30">
        <span>人间浊物</span>
      </a>
      <nav>
        <ul class="nav-menu" id="nav-menu">
          <li><a href="index.html">首页</a></li>
          <li><a href="notes.html">小记</a></li>
          <li><a href="articles.html">文章</a></li>
          <li><a href="about.html">关于</a></li>
          <li><button class="theme-toggle" id="theme-toggle" title="切换主题" aria-label="切换主题">☾</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="content-wrapper">
      <div class="section-header">
        <h1 class="section-title">小记</h1>
      </div>
      <p class="page-intro">片言只语，随感随记。不求长篇，但求真意。</p>

      <div class="notes-list" id="notes-list">
        <div class="empty-state">
          <div class="loading-spinner"></div>
          <p class="empty-state-text">正在加载...</p>
        </div>
      </div>

      <div class="pagination" id="pagination" hidden>
        <button class="pagination-btn" id="prev-btn" disabled>← 上一页</button>
        <span class="pagination-info" id="page-info">1 / 1</span>
        <button class="pagination-btn" id="next-btn" disabled>下一页 →</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="index.html">首页</a>
        <a href="notes.html">小记</a>
        <a href="articles.html">文章</a>
        <a href="about.html">关于</a>
        <a href="feed.xml" type="application/rss+xml">RSS</a>
      </div>
      <p>&copy; 2026 人间浊物. 琅上清书</p>
    </div>
  </footer>

  <button class="back-to-top" id="back-to-top" title="返回顶部" aria-label="返回顶部">↑</button>

  <script src="js/app.js"></script>
  <script src="js/pet.js" defer></script>
  <script>
    (async function() {
      const PAGE_SIZE = 10;
      let currentPage = 1;

      const allNotes = BlogApp.sortByDateDesc(await BlogApp.loadData('notes'));

      const notesList = document.getElementById('notes-list');
      const pagination = document.getElementById('pagination');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const pageInfo = document.getElementById('page-info');

      function renderPage() {
        const totalPages = Math.ceil(allNotes.length / PAGE_SIZE) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageNotes = allNotes.slice(start, start + PAGE_SIZE);

        notesList.innerHTML = pageNotes.length === 0
          ? BlogApp.emptyStateHtml('📌', '暂无小记')
          : pageNotes.map((note, index) => BlogApp.noteCardHtml(note, index)).join('');

        BlogApp.renderPagination({ totalPages, currentPage, pagination, pageInfo, prevBtn, nextBtn });
      }

      function goToPage(page) {
        const totalPages = Math.ceil(allNotes.length / PAGE_SIZE) || 1;
        if (page < 1 || page > totalPages || page === currentPage) return;
        currentPage = page;
        renderPage();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
      nextBtn.addEventListener('click', () => goToPage(currentPage + 1));

      renderPage();
    })();
  </script>
</body>
</html>
