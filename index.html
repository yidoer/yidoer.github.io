<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/pet.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
  <link rel="canonical" href="https://yidoer.github.io/">
  <link rel="alternate" type="application/rss+xml" title="人间浊物 琅上清书" href="https://yidoer.github.io/feed.xml">
  <link rel="alternate" type="application/rss+xml" title="小记" href="https://yidoer.github.io/feed-notes.xml">
  <link rel="alternate" type="application/atom+xml" title="文章" href="https://yidoer.github.io/feed-atom.xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="人间浊物 琅上清书">
  <meta property="og:title" content="人间浊物 琅上清书">
  <meta property="og:description" content="个人博客 · 以墨为友 — 长篇大论与片言只语。">
  <meta property="og:url" content="https://yidoer.github.io/">
  <meta property="og:image" content="https://yidoer.github.io/images/touxiang.jpg">
  <meta name="twitter:card" content="summary">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <img class="logo-avatar" src="images/touxiang.jpg" alt="清" width="30" height="30">
        <span>人间浊物</span>
      </a>
      <nav>
        <ul class="nav-menu" id="nav-menu">
          <li><a href="index.html">首页</a></li>
          <li><a href="notes.html">小记</a></li>
          <li><a href="articles.html">文章</a></li>
          <li><a href="about.html">关于</a></li>
          <li><button class="theme-toggle" id="theme-toggle" title="切换主题" aria-label="切换主题">☾</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <!-- 封面区域 -->
    <section class="hero-section">
      <div class="hero-content">
        <span class="hero-eyebrow">个人博客 · 以墨为友</span>
        <h1 class="hero-title">人间浊物</h1>
        <p class="hero-subtitle">琅上清书</p>
        <div class="hero-divider"></div>
      </div>
      <a href="#latest" class="hero-scroll">
        <span>向下</span>
        <span>↓</span>
      </a>
    </section>

    <!-- 最新内容 -->
    <section id="latest" class="content-wrapper">
      <!-- 最新文章 -->
      <div class="section-header">
        <h2 class="section-title">最新文章</h2>
        <a href="articles.html" class="section-more">查看全部 →</a>
      </div>
      <div class="article-grid" id="latest-articles">
        <div class="empty-state">
          <div class="loading-spinner"></div>
          <p class="empty-state-text">正在加载...</p>
        </div>
      </div>

      <!-- 最新小记 -->
      <div class="section-header section-header--spaced">
        <h2 class="section-title">最新小记</h2>
        <a href="notes.html" class="section-more">查看全部 →</a>
      </div>
      <div class="notes-list" id="latest-notes">
        <div class="empty-state">
          <div class="loading-spinner"></div>
          <p class="empty-state-text">正在加载...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="index.html">首页</a>
        <a href="notes.html">小记</a>
        <a href="articles.html">文章</a>
        <a href="about.html">关于</a>
        <a href="editor.html">编辑</a>
        <a href="feed.xml" type="application/rss+xml">RSS</a>
      </div>
      <p>&copy; 2026 人间浊物. 琅上清书</p>
    </div>
  </footer>

  <button class="back-to-top" id="back-to-top" title="返回顶部" aria-label="返回顶部">↑</button>

  <script src="js/app.js"></script>
  <script src="js/pet.js" defer></script>
  <script>
    (async function() {
      // 加载最新文章
      const articles = await BlogApp.loadData('articles');
      const latestArticlesContainer = document.getElementById('latest-articles');
      if (articles.length === 0) {
        latestArticlesContainer.innerHTML = BlogApp.emptyStateHtml('📝', '暂无文章');
      } else {
        const latest = BlogApp.sortByDateDesc(articles).slice(0, 3);
        latestArticlesContainer.innerHTML = latest
          .map((article, index) => BlogApp.articleCardHtml(article, index))
          .join('');
      }

      // 加载最新小记
      const notes = await BlogApp.loadData('notes');
      const latestNotesContainer = document.getElementById('latest-notes');
      if (notes.length === 0) {
        latestNotesContainer.innerHTML = BlogApp.emptyStateHtml('📌', '暂无小记');
      } else {
        const latest = BlogApp.sortByDateDesc(notes).slice(0, 4);
        latestNotesContainer.innerHTML = latest
          .map((note, index) => BlogApp.noteCardHtml(note, index))
          .join('');
      }
    })();
  </script>
</body>
</html>
