<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>文章 - 人间浊物 琅上清书</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pet.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📜</text></svg>">
  <link rel="canonical" href="https://yidoer.github.io/articles.html">
  <link rel="alternate" type="application/atom+xml" title="人间浊物 琅上清书 · 文章" href="https://yidoer.github.io/feed-atom.xml">
  <link rel="alternate" type="application/rss+xml" title="人间浊物 琅上清书" href="https://yidoer.github.io/feed.xml">
  <meta property="og:type" content="website">
  <meta property="og:title" content="文章 - 人间浊物 琅上清书">
  <meta property="og:description" content="长篇大论，慎思而著。或叙或议，但求言之有物。">
  <meta property="og:url" content="https://yidoer.github.io/articles.html">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-logo">
        <img class="logo-avatar" src="images/touxiang.jpg" alt="清" width="30" height="30">
        <span>人间浊物</span>
      </a>
      <nav>
        <ul class="nav-menu" id="nav-menu">
          <li><a href="index.html">首页</a></li>
          <li><a href="notes.html">小记</a></li>
          <li><a href="articles.html">文章</a></li>
          <li><a href="about.html">关于</a></li>
          <li><button class="theme-toggle" id="theme-toggle" title="切换主题" aria-label="切换主题">☾</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <div class="content-wrapper">
      <div class="section-header">
        <h1 class="section-title">文章</h1>
      </div>
      <p class="page-intro">长篇大论，慎思而著。或叙或议，但求言之有物。</p>

      <!-- 标签筛选 -->
      <div class="tag-list" id="tag-list" hidden></div>

      <div class="article-grid" id="articles-list">
        <div class="empty-state">
          <div class="loading-spinner"></div>
          <p class="empty-state-text">正在加载...</p>
        </div>
      </div>

      <div class="pagination" id="pagination" hidden>
        <button class="pagination-btn" id="prev-btn" disabled>← 上一页</button>
        <span class="pagination-info" id="page-info">1 / 1</span>
        <button class="pagination-btn" id="next-btn" disabled>下一页 →</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-links">
        <a href="index.html">首页</a>
        <a href="notes.html">小记</a>
        <a href="articles.html">文章</a>
        <a href="about.html">关于</a>
        <a href="feed.xml" type="application/rss+xml">RSS</a>
      </div>
      <p>&copy; 2026 人间浊物. 琅上清书</p>
    </div>
  </footer>

  <button class="back-to-top" id="back-to-top" title="返回顶部" aria-label="返回顶部">↑</button>

  <script src="js/app.js"></script>
  <script src="js/pet.js" defer></script>
  <script>
    (async function() {
      const PAGE_SIZE = 10;
      let currentPage = 1;
      let currentTag = '';

      const allArticles = BlogApp.sortByDateDesc(await BlogApp.loadData('articles'));
      let filteredArticles = [...allArticles];

      const tagList = document.getElementById('tag-list');
      const articlesList = document.getElementById('articles-list');
      const pagination = document.getElementById('pagination');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      const pageInfo = document.getElementById('page-info');

      // 收集所有标签
      const allTags = new Set();
      allArticles.forEach(article => (article.tags || []).forEach(tag => allTags.add(tag)));

      if (allTags.size > 0) {
        const tagsHtml = Array.from(allTags).sort()
          .map(tag => `<span class="tag-item" data-tag="${BlogApp.escapeHtml(tag)}">${BlogApp.escapeHtml(tag)}</span>`)
          .join('');
        tagList.innerHTML = `<span class="tag-item active" data-tag="">全部</span>${tagsHtml}`;
        tagList.hidden = false;
      }

      tagList.addEventListener('click', event => {
        const item = event.target.closest('.tag-item');
        if (!item) return;
        tagList.querySelectorAll('.tag-item').forEach(t => t.classList.remove('active'));
        item.classList.add('active');
        currentTag = item.dataset.tag || '';
        currentPage = 1;
        filteredArticles = currentTag === ''
          ? [...allArticles]
          : allArticles.filter(article => (article.tags || []).includes(currentTag));
        renderPage();
      });

      function renderPage() {
        const totalPages = Math.ceil(filteredArticles.length / PAGE_SIZE) || 1;
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * PAGE_SIZE;
        const pageArticles = filteredArticles.slice(start, start + PAGE_SIZE);

        articlesList.innerHTML = pageArticles.length === 0
          ? BlogApp.emptyStateHtml('📝', currentTag ? '该标签下暂无文章' : '暂无文章')
          : pageArticles.map((article, index) => BlogApp.articleCardHtml(article, index)).join('');

        BlogApp.renderPagination({ totalPages, currentPage, pagination, pageInfo, prevBtn, nextBtn });
      }

      function goToPage(page) {
        const totalPages = Math.ceil(filteredArticles.length / PAGE_SIZE) || 1;
        if (page < 1 || page > totalPages || page === currentPage) return;
        currentPage = page;
        renderPage();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
      nextBtn.addEventListener('click', () => goToPage(currentPage + 1));

      renderPage();
    })();
  </script>
</body>
</html>
